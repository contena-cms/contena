parameters:
    default_cdn_strategy: "id"
    env(APP_URL): ''
    env(PRODUCT_ANALYTICS_GATEWAY_URL): 'https://product-analytics-gateway.services.contena.io'
    APP_URL: "%env(string:APP_URL)%"
    env(REDIS_PREFIX): ''

contena:
    http_cache:
        cookies: []
        soft_purge: false
        reverse_proxy:
            enabled: false
            ban_method: "BAN" # This can defer from used reverse proxy
            hosts: [ "http://varnish" ]
            max_parallel_invalidations: 2
            purge_all:
            fastly:

        ignored_url_parameters:
            - 'pk_campaign' # Piwik
            - 'piwik_campaign'
            - 'pk_kwd'
            - 'piwik_kwd'
            - 'pk_keyword'
            - 'piwik_keyword'
            - 'mtm_campaign' # Matomo
            - 'matomo_campaign'
            - 'mtm_cid'
            - 'matomo_cid'
            - 'mtm_kwd'
            - 'matomo_kwd'
            - 'mtm_keyword'
            - 'matomo_keyword'
            - 'mtm_source'
            - 'matomo_source'
            - 'mtm_medium'
            - 'matomo_medium'
            - 'mtm_content'
            - 'matomo_content'
            - 'mtm_group'
            - 'matomo_group'
            - 'mtm_placement'
            - 'matomo_placement'
            - 'pixelId' # Yahoo
            - 'kwid'
            - 'kw'
            - 'chl'
            - 'dv'
            - 'nk'
            - 'pa'
            - 'camid'
            - 'adgid'
            - 'yclid'
            - 'utm_term' # Google
            - 'utm_source'
            - 'utm_medium'
            - 'utm_campaign'
            - 'utm_content'
            - 'cx'
            - 'ie'
            - 'cof'
            - 'siteurl'
            - '_ga' # Google Analytics
            - 'adgroupid'
            - 'campaignid'
            - 'adid'
            - 'utm_id'
            - 'utm_source_platform'
            - 'utm_creative_format'
            - 'utm_marketing_tactic'
            - '_gl'
            - 'gclsrc'
            - 'gPromoCode' # Google Merchant Center
            - 'gQT' # Google Merchant Center
            - 'gclid'
            - 'srsltid'
            - 'dclid'
            - 'gbraid'
            - 'wbraid'
            - 'gad_source'
            - 'gad_campaignid'
            - 'fbclid' # Facebook
            - 'fb_action_ids'
            - 'fb_action_types'
            - 'fb_source'
            - 'mc_cid' # Mailchimp
            - 'mc_eid'
            - '_bta_tid' # Bronto
            - '_bta_c'
            - 'trk_contact' # Listrak
            - 'trk_msg'
            - 'trk_module'
            - 'trk_sid'
            - 'gdfms'  # GodataFeed
            - 'gdftrk'
            - 'gdffi'
            - '_ke'  # Klaviyo
            - '_kx'
            - 'redirect_log_mongo_id' # MongoDB
            - 'redirect_mongo_id'
            - 'sb_referer_host'
            - 'mkwid' # Marin
            - 'pcrid'
            - 'ef_id' # Adobe Advertising Cloud
            - 's_kwcid' # Adobe Analytics
            - 'msclkid' # Microsoft Advertising
            - 'dm_i' # dotdigital
            - 'epik' # Pinterest
            - 'pp'
            - 'twclid' # Twitter / X
            - 'hsa_cam' # Hubspot
            - 'hsa_grp'
            - 'hsa_mt'
            - 'hsa_src'
            - 'hsa_ad'
            - 'hsa_acc'
            - 'hsa_net'
            - 'hsa_kw'
            - 'hsa_tgt'
            - 'hsa_ver'
            - '_branch_match_id' # Branch
            - 'mkevt' # eBay
            - 'mkcid'
            - 'mkrid'
            - 'campid'
            - 'toolid'
            - 'customid'
            - 'igshid' # Instagram
            - 'si' # Spotify
            - 'ttclid' #  TikTok
            - 'ScCid' # Snapchat
            - 'rtid' # Rokt
            - 'irclickid' # Impact
            - 'klar_source'
            - 'klar_cpid'
            - 'klar_adid'

        # Cache policies (feature flag CACHE_REWORK)
        policies:
            no_cache_private:
                headers:
                    cache_control:
                        private: true
                        no_cache: true
                        max_age: 0
                        s_maxage: 0

            channel_api.cacheable:
                headers:
                    cache_control:
                        public: true
                        max_age: 0
                        s_maxage: 1800
                        stale_while_revalidate: 86400
                        stale_if_error: 7200

            frontend.cacheable:
                headers:
                    cache_control:
                        public: true
                        max_age: 0
                        must_revalidate: true
                        s_maxage: 7200

        default_policies:
            frontend:
                cacheable: frontend.cacheable
                uncacheable: no_cache_private
            channel_api:
                cacheable: channel_api.cacheable
                uncacheable: no_cache_private

    profiler:
        integrations: []
    filesystem:
        private:
            type: "local"
            visibility: "private"
            config:
                root: "%kernel.project_dir%/files"
        public:
            type: "local"
            visibility: "public"
            config:
                root: "%kernel.project_dir%/public"
        temp:
            type: "local"
            config:
                root: "%kernel.project_dir%/var"
        theme:
        asset:
        sitemap:
        allowed_extensions: ["jpg", "jpeg", "png", "webp", "avif", "gif", "svg", "bmp", "tiff", "tif", "eps", "webm", "mkv", "flv", "ogv", "ogg", "mov", "mp4", "avi", "wmv", "pdf", "aac", "mp3", "wav", "flac", "oga", "wma", "txt", "doc", "docx", "ico", "glb", "csv", "xls", "xlsx", "html", "vtt", "srt", "sub", "ass", "ssa", "step", "stp"]
        private_allowed_extensions: ["jpg", "jpeg", "png", "webp", "avif", "gif", "svg", "bmp", "tiff", "tif", "eps", "webm", "mkv", "flv", "ogv", "ogg", "mov", "mp4", "avi", "wmv", "pdf", "aac", "mp3", "wav", "flac", "oga", "wma", "txt", "doc", "docx", "ico", "glb", "zip", "rar", "csv", "xls", "xlsx", "html", "xml", "vtt", "srt", "sub", "ass","ssa", "step", "stp"]
        private_local_download_strategy: "php"
        private_local_path_prefix: ""
        batch_write_size: 250

    cdn:
        url: ''
        strategy: "%env(string:default:default_cdn_strategy:CONTENA_CDN_STRATEGY_DEFAULT)%"
        fastly:
            api_key: ''
            soft_purge: false
            max_parallel_invalidations: 2

    increment:
        user_activity:
            type: 'mysql'

            # type: 'array'

            # type: 'redis'
            #     config:
            #         url: 'redis://localhost'

            #         url: 'redis://localhost'

    api:
        max_limit: 500
        channel:
            context_lifetime: 'P1D' # 1 day interval, see also https://www.php.net/manual/en/dateinterval.construct.php#refsect1-dateinterval.construct-parameters
            max_limit: 100
        api_browser:
            auth_required: true
        static_token: # Optionally used for 'Authorization: Static ...' header in addition to normal bearer authorization for specific HTTP endpoints
            health_check: ''
        rate_limiter:
            login:
                enabled: true
                policy: 'time_backoff'
                reset: '24 hours' # reset limit after this time if no more requests failed
                limits:
                    - limit: 10
                      interval: '10 seconds'
                    - limit: 15
                      interval: '30 seconds'
                    - limit: 20
                      interval: '60 seconds'
            oauth:
                enabled: true
                policy: 'time_backoff'
                reset: '24 hours'
                limits:
                    - limit: 10
                      interval: '10 seconds'
                    - limit: 15
                      interval: '30 seconds'
                    - limit: 20
                      interval: '60 seconds'
            mcp_admin_api:
                enabled: true
                policy: 'time_backoff'
                reset: '24 hours'
                limits:
                    - limit: 60
                      interval: '60 seconds'
            mcp_channel_api:
                enabled: true
                policy: 'time_backoff'
                reset: '1 hours'
                limits:
                    - limit: 120
                      interval: '60 seconds'
                    - limit: 600
                      interval: '10 minutes'
            reset_password:
                enabled: true
                policy: 'time_backoff'
                reset: '24 hours'
                limits:
                    - limit: 3
                      interval: '30 seconds'
                    - limit: 5
                      interval: '60 seconds'
                    - limit: 10
                      interval: '90 seconds'
            user_recovery:
                enabled: true
                policy: 'time_backoff'
                reset: '24 hours'
                limits:
                    - limit: 3
                      interval: '30 seconds'
                    - limit: 5
                      interval: '60 seconds'
                    - limit: 10
                      interval: '90 seconds'
            notification:
                enabled: true
                policy: 'time_backoff'
                reset: '24 hours'
                limits:
                    - limit: 10
                      interval: '10 seconds'
                    - limit: 15
                      interval: '30 seconds'
                    - limit: 20
                      interval: '60 seconds'
    admin_worker:
        enable_admin_worker: true
        enable_queue_stats_worker: true
        enable_notification_worker: true
        # This has to be lower than PHP's max_execution_time (default: 30s)
        poll_interval: 20
        transports: ["async", "low_priority"]

    auto_update:
        enabled: true

    store:
        frw: false
        use_channel_cookie_path: false

    sitemap:
        batchsize: 100
        custom_urls:
        excluded_urls:
        scheduled_task:
            enabled: true

    translation:
        use_local_filesystem: false
        scheduled_task:
            enabled: true

    deployment:
        blue_green: '%env(bool:default:defaults_bool_true:BLUE_GREEN_DEPLOYMENT)%'
        cluster_setup: false

    media:
        enable_url_upload_feature: true
        enable_url_validation: true
        url_upload_max_size: 0
        remote_thumbnails:
            enable: false
            pattern: '{mediaUrl}/{mediaPath}?width={width}&ts={mediaUpdatedAt}'
            fallback_sizes: []
        presigned_upload:
            enabled: false
            expiration_minutes: 5
        svg:
            allowed_elements: ["a", "animate", "animatetransform", "circle", "clippath", "defs", "desc", "ellipse", "feblend", "fecolormatrix", "fecomposite", "feflood", "fegaussianblur", "femorphology", "feoffset", "filter", "font", "font-face", "g", "glyph", "hkern", "image", "line", "lineargradient", "marker", "mask", "metadata", "missing-glyph", "path", "pattern", "polygon", "polyline", "radialgradient", "rect", "stop", "style", "svg", "switch", "symbol", "text", "title", "tspan", "use", "view", "vkern"]
            allowed_attributes: ["alphabetic", "alignment-baseline", "accumulate", "additive", "aria-describedby", "aria-hidden", "aria-label", "aria-labelledby", "aria-roledescription", "ascent", "attributename", "attributetype", "baseprofile", "baseline-shift", "bbox", "cap-height", "class", "clip-path", "clip-rule", "clippathunits", "color", "color-interpolation", "color-interpolation-filters", "color-rendering", "begin", "by", "calcmode", "cursor", "cx", "cy", "d", "descent", "direction", "display", "dominant-baseline", "dur", "enable-background", "dx", "dy", "fill", "fill-opacity", "fill-rule", "filter", "filterunits", "focusable", "flood-color", "flood-opacity", "font-family", "font-size", "font-size-adjust", "font-stretch", "font-style", "font-variant", "font-weight", "font-scale", "from", "fx", "fy", "g1", "g2", "glyph-name", "gradienttransform", "gradientunits", "height", "horiz-adv-x", "href", "id", "image-rendering", "in", "in2", "isolation", "k", "keysplines", "keytimes", "lang", "letter-spacing", "lighting-color", "marker", "marker-end", "marker-mid", "marker-start", "markerheight", "markerunits", "markerwidth", "mask", "mask-type", "maskcontentunits", "maskunits", "mix-blend-mode", "mode", "offset", "opacity", "operator", "orient", "overflow", "paint-order", "panose-1", "path", "patterncontentunits", "patterntransform", "patternunits", "pointer-events", "points", "preserveaspectratio", "r", "radius", "refx", "refy", "repeatcount", "repeatdur", "requiredfeatures", "restart", "result", "role", "rotate", "rx", "ry", "shape-rendering", "slope", "space", "spreadmethod", "stddeviation", "stop-color", "stop-opacity", "stroke", "stroke-dasharray", "stroke-dashoffset", "stroke-linecap", "stroke-linejoin", "stroke-miterlimit", "stroke-opacity", "stroke-width", "style", "t", "text", "text-anchor", "text-decoration", "text-overflow", "text-rendering", "transform", "transform-origin", "type", "title", "to", "u1", "u2", "underline-position", "underline-thickness", "unicode", "unicode-bidi", "unicode-range", "units-per-em", "values", "vector-effect", "version", "viewbox", "visibility", "white-space", "width", "word-spacing", "writing-mode", "x-height", "x", "x1", "x2", "xlink:href", "xml:lang", "xml:space", "xmlns", "xmlns:xlink", "y", "y1", "y2", "zoomandpan"]
            allowed_reference_attributes: ["href", "xlink:href"]

    dal:
        batch_size: 125
        max_rule_prices: 100
        versioning:
            expire_days: 30

    mail:
        update_mail_variables_on_send: true
        max_body_length: 0

    cart:
        compress: false
        serialization_max_mb_size:
        expire_days: 120
        storage:
            # supported types: mysql, redis
            # for redis also the contena.cart.storage.config.connection is required to point to a valid redis connection
            type: "mysql"

    order:
        deep_link:
            expire_days: 30

    number_range:
        # supported types: mysql, redis
        # for redis also the contena.number_range.config.connection is required to point to a valid redis connection
        increment_storage: "mysql"

    channel_context:
        expire_days: 120

    html_sanitizer:
        enabled: true
        cache_dir: '%kernel.cache_dir%'
        cache_enabled: true
        sets:
            - name: HTML5
              tags: ["article", "aside", "audio", "bdi", "canvas", "datalist", "details", "dialog", "embed", "figcaption", "figure", "footer", "header", "main", "mark", "meter", "nav", "progress", "rp", "rt", "ruby", "section", "summary", "time", "wbr", "output", "canvas", "svg", "track", "video", "source", "input"]
              attributes: ["controls", "open", "min", "max", "datetime", "for", "type", "kind", "srclang", "label", "value", "placeholder", "autoplay", "loop", "muted", "preload", "low", "high", "optimum", "default", "poster", "media", "maxlength", "minlength", "pattern", "required", "autocomplete", "autofocus", "disabled", "readonly", "multiple", "formaction", "formenctype", "formmethod", "formnovalidate", "formtarget", "list", "step", "checked", "accept"]
            - name: basic
              tags: ["a", "abbr", "acronym", "address", "b", "bdo", "big", "blockquote", "br", "caption", "center", "cite", "code", "col", "colgroup", "dd", "del", "dfn", "dir", "div", "dl", "dt", "em", "font", "h1", "h2", "h3", "h4", "h5", "h6", "hr", "i", "ins", "kbd", "li", "menu", "ol", "p", "pre", "q", "s", "samp", "small", "span", "strike", "strong", "sub", "sup", "table", "tbody", "td", "tfoot", "th", "thead", "tr", "tt", "u", "ul", "var", "img"]
              attributes: ["align", "bgcolor", "border", "cellpadding", "cellspacing", "cite", "class", "clear", "color", "colspan", "dir", "face", "frame", "height", "href", "id", "lang", "name", "noshade", "nowrap", "rel", "rev", "rowspan", "scope", "size", "span", "start", "style", "summary", "title", "type", "valign", "value", "width", "target", "src", "alt"]
              options:
                  - key: Attr.AllowedFrameTargets
                    values: ['_blank', '_self', '_parent', '_top']
                  - key: Attr.AllowedRel
                    values: ['nofollow', 'print']
                  - key: Attr.EnableID
                    value: true
            - name: media
              tags: ["img"]
              attributes: ["src", "alt"]
            - name: script
              tags: ["script"]
              options:
                  - key: HTML.Trusted
                    value: true
            - name: tidy
              options:
                  - key: Output.TidyFormat
                    value: true
    logger:
        enforce_throw_exception: '%env(bool:default:defaults_bool_false:LOGGER_ENFORCE_THROW_EXCEPTION)%'
        file_rotation_count: 14
        exclude_exception:
            - League\OAuth2\Server\Exception\OAuthServerException
            - Symfony\Component\HttpKernel\Exception\NotFoundHttpException
            - Contena\Core\Framework\Routing\Exception\LanguageNotFoundException
        exclude_events:
            - user.recovery.request
        error_code_log_levels:
            CONTENT__MEDIA_INVALID_CONTENT_LENGTH: notice
            CONTENT__MEDIA_INVALID_URL: notice
            CONTENT__MEDIA_ILLEGAL_URL: notice
            CONTENT__MEDIA_DISABLE_URL_UPLOAD_FEATURE: notice
            CONTENT__MEDIA_CANNOT_OPEN_SOURCE_STREAM_TO_READ: notice
            CONTENT__MEDIA_CANNOT_OPEN_SOURCE_STREAM_TO_WRITE: notice
            CONTENT__MEDIA_FILE_SIZE_LIMIT_EXCEEDED: notice
            CONTENT__MEDIA_MISSING_FILE_EXTENSION: notice
            CONTENT__MEDIA_MISSING_URL_PARAMETER: notice
            CONTENT__MEDIA_ILLEGAL_FILE_NAME: notice
            CONTENT__MEDIA_EMPTY_FILE: notice
            CONTENT__MEDIA_INVALID_FILE: notice
            CONTENT__MEDIA_EMPTY_FILE_NAME: notice
            CONTENT__MEDIA_FOLDER_NOT_FOUND: notice
            CONTENT__MEDIA_FOLDER_NAME_NOT_FOUND: notice
            CONTENT__MEDIA_FILE_TYPE_NOT_SUPPORTED: notice
            CONTENT__MEDIA_EMPTY_ID: notice
            CONTENT__MEDIA_FILE_NOT_SUPPORTED_FOR_THUMBNAIL: notice
            CONTENT__MEDIA_STRATEGY_NOT_FOUND: notice
            CONTENT__MEDIA_DUPLICATED_FILE_NAME: notice
            CONTENT__MEDIA_NOT_FOUND: notice
            CONTENT__MEDIA_MISSING_FILE: notice
            CONTENT__MEDIA_PRESIGNED_UPLOAD_DISABLED: notice
            CONTENT__MEDIA_PRESIGNED_UPLOAD_NOT_SUPPORTED: notice
            CONTENT__MEDIA_PRESIGNED_UPLOAD_FINALIZE_FAILED: notice
            CONTENT__LANDING_PAGE_NOT_FOUND: notice
            FRAMEWORK__API_INVALID_ACCESS_KEY: notice
            FRAMEWORK__CANNOT_CREATE_NEW_VERSION: notice
            FRAMEWORK__LANGUAGE_NOT_FOUND: notice
            FRAMEWORK__SYNC_ACTION_PROCESS_INTERRUPTED: notice
            FRAMEWORK__WRITE_TYPE_INTEND_ERROR: notice
            FRAMEWORK__MISSING_REQUEST_PARAMETER: notice
            FRAMEWORK__INVALID_REQUEST_PARAMETER: notice
            FRAMEWORK__INVALID_TEMPLATE_SYNTAX: notice
            FRAMEWORK__INVALID_CAPTCHA_VALUE: notice
            FRAMEWORK__RATE_LIMIT_EXCEEDED: notice
            SYSTEM__SCOPE_NOT_FOUND: notice
            SYSTEM__STATE_MACHINE_INVALID_ENTITY_ID: notice
            SYSTEM__LANGUAGE_INVALID_EXCEPTION: notice
            SYSTEM__COUNTRY_DOES_NOT_EXISTS_EXCEPTION: notice
            SYSTEM__COUNTRY_STATE_DOES_NOT_EXISTS_EXCEPTION: notice
            SYSTEM__NO_CONTEXT_DATA_EXCEPTION: notice

    cache:
        redis_prefix: '%env(REDIS_PREFIX)%'
        disable_stampede_protection: false
        twig:
            string_template_renderer_cache_dir: '%kernel.cache_dir%/twig/string-template-renderer'
        invalidation:
            delay_enabled: true
            delay_options:
                storage: mysql
            tag_invalidation_log_enabled: false

    twig:
        allowed_php_functions: []

    dompdf:
        options:
            isRemoteEnabled: true

    stock:
        enable_stock_management: true

    usage_data:
        collection_enabled: true
        gateway:
            dispatch_enabled: true
            base_uri: 'https://data.contena.io'
            batch_size: 50

    feature_toggle:
        enable: true

    search:
        term_max_length: 300
        # special chars that will not be removed on tokenizing
        preserved_chars: ['-', '_', '+', '.', '@']

    blog:
        allowed_types:
          - post
          - media
        search_keyword:
            indexing: true
            relevant_keyword_count: 8

    staging:
        mailing:
            disable_delivery: true
        frontend:
            show_banner: true
        administration:
            show_banner: true
        extensions:
            disable: []

    system_config: []

    messenger:
        message_max_kib_size: 1024 # in KiB
        scheduled_task:
            requeue_timeout: 12 # requeue stuck messages after 12 hours
        routing_overwrite:
        stats:

    product_stream:
        indexing: true
