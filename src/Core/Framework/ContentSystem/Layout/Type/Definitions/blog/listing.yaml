meta:
  label: "Blog Listing"
  description: "Displays a category blog listing with filters, grid, and pagination slots."
  icon: "regular-file"
  category: "content"
  copilot:
    summary: "Category blog listing component."
    hints:
      - "Provide navigationId to load listing data."
      - "Use slots to customize filters, grid, and pagination."

properties:
  navigationId:
    type: string
    title: "Navigation ID"
    description: "Category or navigation id used by blog_listing loader."

  listing:
    type: Contena\Core\Content\Blog\Channel\Listing\BlogListingResult
    title: "Listing"
    description: "Hydrated listing result containing blogs, sorting, and aggregations."

  limit:
    type: integer
    title: "Limit"
    description: "Requested number of blogs per page."
    default: 24
    adminUI:
      component: "number"

  page:
    type: integer
    title: "Page"
    description: "Requested page number."
    default: 1
    adminUI:
      component: "number"

slots:
  - name: filters-panel
    description: "Container slot for filter panel component."
  - name: filters-active
    description: "Container slot for active filters summary."
  - name: blog-grid
    description: "Container slot for blog grid rendering."
  - name: pagination
    description: "Container slot for pagination controls."
