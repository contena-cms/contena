meta:
  label: "Blog Listing"
  description: "Displays a category blog listing with grid and pagination slots."
  icon: "regular-file"
  category: "content"
  copilot:
    summary: "Category blog listing component."
    hints:
      - "The listing is loaded per request from the page's category, no configuration needed."
      - "Filters are a separate Filter Panel element. Place one alongside the listing."
      - "Use slots to customize the grid and pagination."

properties:
  listing:
    type: Contena\Core\Content\Blog\Channel\Listing\BlogListingResult
    title: "Listing"
    description: "Hydrated listing result containing blogs, sorting, and aggregations. Received as root-scoped context from the page, which loads it once, so a listing and a filter panel beside it share one load."

  limit:
    type: integer
    title: "Limit"
    description: "Requested number of blogs per page."
    default: 24
    adminUI:
      component: "number"

  page:
    type: integer
    title: "Page"
    description: "Requested page number."
    default: 1
    adminUI:
      component: "number"

  showSorting:
    type: boolean
    title: "Show Sorting"
    description: "Whether the sorting select is offered."
    default: true
    adminUI:
      panel: "sorting"

  showLayoutSwitch:
    type: boolean
    title: "Show Layout Switch"
    description: "Whether to show listing layout toggle actions."
    default: true
    adminUI:
      panel: "sorting"

slots:
  - name: blog-grid
    description: "Container slot for blog grid rendering."
  - name: pagination
    description: "Container slot for pagination controls."
