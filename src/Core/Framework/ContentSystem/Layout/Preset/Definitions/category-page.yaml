id: core.category-page
name: "Category page"
description: "Collection of components that make up the category page."
icon: "regular-boxes"
layout:
  - component: Ct:Grid:Container
    properties:
      mode: explicit
      columns: 4
      justify: stretch
    slots:
      content:
        - component: Ct:Navigation:Tree
          style:
            display:
              xs: false
              sm: false
              md: false
              lg: true
              xl: true
              xxl: true
        - component: Ct:Blog:Listing
          style:
            col-span:
              xs: 4
              sm: 4
              md: 4
              lg: 3
              xl: 3
              xxl: 3
          slots:
            filters-panel:
              - component: Ct:Filter:Panel
