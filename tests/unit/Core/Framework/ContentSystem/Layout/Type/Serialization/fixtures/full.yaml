meta:
  label: "Blog Card"
  description: "Displays a blog card."
  icon: "blog"
  category: "commerce"
  copilot:
    summary: "Blog card for grids."
    hints:
      - "Supports horizontal layout."
      - "Requires blog entity."

properties:
  blog:
    type: Contena\Core\Content\Blog\Channel\ChannelBlogEntity
    required: true
    title: "Blog"
    description: "The blog to display."
  layout:
    type: string
    title: "Layout"
    description: "Card layout."
    default: "default"
    enum:
      - "default"
      - "horizontal"
  text:
    type: string
    translatable: true
    title: "Text"
    description: "The text content."
  showBadge:
    type: boolean
    title: "Show Badge"
    description: "Display discount badge."
    default: true
  columns:
    type: integer
    title: "Columns"
    description: "Grid column count."
    default: 3
  opacity:
    type: number
    title: "Opacity"
    description: "Element opacity."
    default: 0.8
  size:
    type: string
    title: "Size"
    description: "Element size."
    adminUI:
      component: "select"

slots:
  - name: media
    maxElements: 1
    allowList:
      - "CT:Media:Image"
    description: "Blog media."
  - name: footer
    description: "Footer area."
